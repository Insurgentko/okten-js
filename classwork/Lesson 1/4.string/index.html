<body>
<script>
    <!--Если внутри нужны одинарные кавычки, тогда снаружи должны быть двойные и наоборот-->
    let a = '"asdasd"';
    let b = "'asdasd'";
    console.log(a, b);
    // Бек квоты шаблонная строка
    let greeting = 'hello';
    let intro = 'my name vasya';
    let msg = greeting + ' ' + intro
    console.log(msg);
    // `` — шаблонные строки (template literals), внутри них можно писать интерполяцию и в неё
    // пихать regex (регулярные выражения)
    // Интерполяция ${RegEx}
    let msg2 = `${greeting} ${intro}`
    console.log(msg2)
</script>
