<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>
    // arguments — это специальный объект, который автоматически доступен внутри каждой обычной функции (не стрелочной!) и содержит все переданные в неё аргументы, даже если они не были указаны в списке параметров.
    function sumAll() {
        let total = 0;
        for (let i = 0; i < arguments.length; i++) {
            total += arguments[i];
        }
        return total;
    }

    console.log(sumAll(1, 2, 3));       // 6
    console.log(sumAll(1, 2, 3, 4, 5)); // 15
</script>
</body>
</html>
