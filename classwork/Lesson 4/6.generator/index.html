<body>
<script>
    // звёздочка перед функцией означает что это функция генератор
    // yield = своеобразный return генераторов, после каждого yield вызывается следующий, при этом состояние последнегго вызванного запоминается
    // function* foo() {
    //     yield 100;
    //     yield 200;
    //     yield 300;
    // }
    //
    // let fooGenerator = foo();
    //
    // console.log(fooGenerator.next())

    function* cardsHolder(){
        const cards = [
            {value: 6, suite: 'diamond'},
            {value: 9, suite: 'spade'},
            {value: 1, suite: 'spade'},
            {value: 3, suite: 'heart'},
        ]
        for (const item of cards){
            yield item;
        }
    }
    let holder = cardsHolder();
    console.log(holder.next())
    console.log(holder.next())

</script>
</body>
</html>
