<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>
    // this. указывает вызов метода или переменной указанного обьёкта
    let user = {
        name: 'vasya',
        greeting: function () {
            console.log(`hello ${this.name}` )
    },
        // ключевое слово this. не работает в стрелочных функциях, this. в стрелочных функциях указывает на определённый обьект window
        vitau: (msg) => console.log(`${msg} ${this.name}` )
    }
    user.greeting();
    user.vitau('salamu allaikum')
</script>
</body>
</html>
