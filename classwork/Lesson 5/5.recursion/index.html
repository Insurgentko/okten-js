    let arr = [1, 2, 3, 4, 5, [7, 9]];

    function flatter(array) {
        let innerArray = [];
        for (const item of array) {
            if (Array.isArray(item)) {
               flatter(item)
            } else {
                innerArray.push(item)
            }
        }
        return innerArray;
    }
    console.log(flatter(arr))
