<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<ul class="users"></ul>
<script>
        // let h2 = document.createElement("h2");
        // h2.innerText = 'h2 Inner Text'
        // document.body.appendChild(h2);


        let collectionOfUsers = document.getElementsByClassName('users')[0]

        let users = [
            {name: 'vasya', age: 31, status: false},
            {name: 'petya', age: 30, status: true},
            {name: 'kolya', age: 29, status: true},
            {name: 'olya', age: 28, status: false},
            {name: 'max', age: 30, status: true},
            {name: 'anya', age: 31, status: false},
            {name: 'oleg', age: 28, status: false},
            {name: 'andrey', age: 29, status: true},
            {name: 'masha', age: 30, status: true},
            {name: 'olya', age: 31, status: false},
            {name: 'max', age: 31, status: true}
        ]; // [{name: string, age: number, status: boolean}]
        for(const user of users){
            let li = document.createElement('li')
            li.classList.add('user')
            li.innerText = user.name;
            collectionOfUsers.appendChild(li);
        }



        let users2 = [
            {name: 'vasya', age: 31, status: false},
            {name: 'petya', age: 30, status: true},
            {name: 'kolya', age: 29, status: true},
            {name: 'olya', age: 28, status: false},
            {name: 'max', age: 30, status: true},
            {name: 'anya', age: 31, status: false},
            {name: 'oleg', age: 28, status: false},
            {name: 'andrey', age: 29, status: true},
            {name: 'masha', age: 30, status: true},
            {name: 'olya', age: 31, status: false},
            {name: 'max', age: 31, status: true}
        ]; // [{name: string, age: number, status: boolean}]

        for (const user of users2){
            let userInfoDiv = document.createElement('div');
            let h2 = document.createElement('h2')
            let p = document.createElement('p')
            h2.innerText = user.name;
            p.innerText = user.age + ' ' + user.status;
            document.body.appendChild(userInfoDiv)
            // userInfoDiv.appendChild(h2);
            // userInfoDiv.appendChild(p);
            userInfoDiv.append(h2,p)
        }
</script>
</body>
</html>
