<body>
<script>
    let time = 43;
    switch (time){
        case time<=20:
            console.log('1 quarter');
            break;
        case time<=40:
            console.log('2 quarter');
            break;
        case time<=59:
            console.log('3 quarter');
            break;
        default: console.log('incorrect time')
    }

</script>
