<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<script>
    let day = prompt('enter the day');
    switch (day){
        case day === 'monday':
            console.log('monday');
            break;
        case day === 'tuesday':
            console.log('tuesday');
            break;
        case day === 'wednesday':
            console.log('wednesday');
            break;
        case day === 'thursday':
            console.log('thursday');
            break;
        case day === 'friday':
            console.log('friday');
            break;

        default: console.log('incorrect day');
    }
</script>
</body>
</html>
