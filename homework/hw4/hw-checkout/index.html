<!doctype html>

<head>

    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

<body>
<script>
    function exchange(sumUAH, currencyValue, exchangeCurrency){
        for (let value of currencyValue){
            if (exchangeCurrency===value.currency){
                return sumUAH/value.value;
            }
        }
    }
    console.log(exchange(10000,[{currency:'USD',value:25},{currency:'EUR',value:42}],'USD')); // => 400
</script>
</body>
</html>
