<script>

    function findMin(arr){
        let minimum=arr[0];
        for (let item of arr){
            if (item<minimum){
                minimum=item;
            }
        }
        return minimum;
    }
    let arr = [1,5,54,36,456,346,6,3475,5326725,73,46341,26,6236,-1000,8]
    console.log(findMin(arr));
</script>
