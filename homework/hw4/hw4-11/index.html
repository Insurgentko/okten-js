<script>

    function findSum(arr){
        let sum=0;
        for (let item of arr){
            sum+=item;
        }
        return sum;
    }
    let arr = [1,5,54,36,456,346,6,3475,73,46341,26,6236,-1000,8]
    console.log(findSum(arr));
</script>
