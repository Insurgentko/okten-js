<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<h1 id="text">text</h1>
<script>
    let idText = document.getElementById('text')
    let disappearButton = document.createElement('button')
    disappearButton.innerText = 'delete Text';
    document.body.appendChild(disappearButton);
    disappearButton.addEventListener('click',function (){
        idText.style.display = 'none';
    });
</script>
</body>
</html>
