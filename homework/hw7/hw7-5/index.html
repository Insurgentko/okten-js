<body>
<script>

    function CarConstructor(carModel, producer, yearOfGraduation, maxSpeed, engineVolume){
        this.carModel = carModel;
        this.producer = producer;
        this.yearOfGraduation = yearOfGraduation;
        this.maxSpeed = maxSpeed;
        this.engineVolume = engineVolume;

    }
    CarConstructor.prototype.drive = function (){
        console.log(`їдемо зі швидкістю ${this.maxSpeed} на годину`)
    }
    CarConstructor.prototype.info = function (){
        for (const key in this) {
            console.log(key, this[key]);
        }
    }
    CarConstructor.prototype.increaseMaxSpeed = function (newSpeed){
        if (newSpeed>0) this.maxSpeed = this.maxSpeed + newSpeed;
    }
    CarConstructor.prototype.changeYear = function (newYear){
        if (newYear>0) this.yearOfGraduation = newYear;
    }
    CarConstructor.prototype.addDriver = function (driver){
        this.driver = driver;
    }


    let car = new CarConstructor('asdf','audi',2000,130,1.5);
    car.addDriver({
        name:'vasya',
        age:55
    });
    car.info()

    let car2 = new CarConstructor('jyeytjyjt','rewqqewrreqwerqw',2111110,3123,123123);
    car2.info()

</script>
