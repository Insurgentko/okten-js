<body>
<script>
    //forEach
    Array.prototype.forAll = function (callback){
        for (const value of this){
            callback(value);
        }
    }


    // filter
    Array.prototype.filtracionale = function (callback){
        let filteredArray = [];
        for (const value of this){
            if (callback(value) === true){
                filteredArray.push(value);
            }
        }
        return filteredArray;
    }

</script>
</body>
