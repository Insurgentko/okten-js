<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>

</head>
<body>
<script>
    function cardDeckGenerator() {
        const cardSuits = [
            {name: `spade`, color: `black`},
            {name: `diamond`, color: `red`},
            {name: `heart`, color: `red`},
            {name: `clubs`, color: `black`}
        ];
        const values = [`ace`, `jack`, `queen`, `king`];
        let cardDeck = [];
        for (const suit of cardSuits) {
            for (let i = 6; i <= 10; i++) {
                cardDeck.push({
                    name: suit.name,
                    value: i,
                    color: suit.color
                });
            }
            for (const value of values){
                cardDeck.push({
                    name: suit.name,
                    value: value,
                    color: suit.color
                });
            }
        }
        return cardDeck;
    }

    let cardDeck = cardDeckGenerator();
    console.log(cardDeck)

    console.log(cardDeck.find(card => card.name === `spade` && card.value === `ace`));
    // find повертає об'єкт котрий знаходить

    console.log(cardDeck.filter(card => card.value === 6));

    console.log(cardDeck.filter(card => card.color === `red`));

    console.log(cardDeck.filter(card => card.name === `diamond`));

    console.log(cardDeck.filter(card => card.name === `clubs` && (card.value >= 9 || typeof card.value === 'string')));

    console.log(cardDeck.reduce((accumulator, card) => {
        switch (card.name) {
            case `spade`:
                accumulator.spades.push(card);
                break;
            case `diamond`:
                accumulator.diamonds.push(card);
                break;
            case `heart`:
                accumulator.hearts.push(card);
                break;
            case `clubs`:
                accumulator.clubs.push(card);
                break;
        }
        return accumulator;
    }, {spades: [], diamonds: [], hearts: [], clubs: []}));


</script>
</body>
</html>
